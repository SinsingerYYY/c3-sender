; PlatformIO Project Configuration File
;
;   IDF5 / Arduino core3 实验工程（上级目录的 IDF5 版本）

[env]
; pioarduino 平台 = arduino-esp32 core 3.3.11 (ESP-IDF 5.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
; core3 C3：ARDUINO_USB_MODE=1 表示 USB-Serial-JTAG(HWCDC)，Serial->HWCDCSerial
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; EspNowBus 供应商化在 lib/EspNowBus；如 core3 编不过需按报错适配或改官方 ESP32_NOW_Serial

[platformio]
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
